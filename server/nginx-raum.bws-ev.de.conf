# /etc/nginx/sites-available/raum.bws-ev.de
# HTTPS-Teil ergänzt certbot automatisch (certbot --nginx -d raum.bws-ev.de).
server {
    listen 80;
    listen [::]:80;
    server_name raum.bws-ev.de;

    root /var/www/raumbelegung;
    index index.html;

    # Seite (gleiche index.html wie auf GitHub Pages)
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # Belegungsdienst
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
}
